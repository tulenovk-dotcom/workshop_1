# Тестовый стенд на GitHub Pages.
#
# Публикует статическую версию каталога: ту же вёрстку и те же стили, что
# и приложение, но без сервера - вся логика в браузере, данные у каждого
# посетителя свои. Нужен, чтобы дать людям ссылку и собрать замечания
# по интерфейсу, а не чтобы работать с настоящими заявками.
#
# Стили берутся из app/static/style.css, чтобы стенд и приложение не
# разъехались: отдельной копии файла нет.

name: Тестовый стенд

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement включает Pages при первом запуске, чтобы не заходить
      # в настройки репозитория руками.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собрать страницу стенда
        run: |
          mkdir -p _site
          cp site/index.html site/app.js _site/
          cp app/static/style.css _site/
          cp app/static/demo/*.png _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
