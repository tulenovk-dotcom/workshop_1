# Автоматическое обновление сайта erekshe.kz на боевом сервере.
#
# Как это работает: GitHub не выкладывает файлы на сервер сам. Он лишь
# подключается к серверу и запускает там скрипт /usr/local/bin/erekshe-deploy,
# а тот уже сам забирает свежий код, делает копию базы, проверяет новую
# версию на отдельном порту и только потом перезапускает сайт.
#
# Поэтому здесь нет ни одного стороннего действия (action): всё, что нужно,
# это записать ключ во временный файл и выполнить одну команду ssh.

name: Выкат на erekshe.kz

# Только отправка в main и ручной запуск по кнопке.
# pull_request отсутствует НАМЕРЕННО: предложение правок из чужой копии
# репозитория не должно иметь возможности запустить выкат на боевой сервер.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкату не нужно ничего менять в репозитории - достаточно чтения.
permissions:
  contents: read

# Два выката одновременно не идут. Отмена начатого выключена намеренно:
# прервать выкат между обновлением кода и перезапуском сайта хуже,
# чем подождать окончания предыдущего.
concurrency:
  group: deploy-erekshe-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Обновить сайт на сервере
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DEPLOY_HOST: 212.116.233.87
      DEPLOY_USER: deploy

    steps:
      - name: Проверить, что секреты заданы
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          ok=1
          if [ -z "$KEY" ]; then
            echo "::error::Не задан секрет DEPLOY_SSH_KEY. Создайте его в Settings -> Secrets and variables -> Actions."
            ok=0
          fi
          if [ -z "$HOSTS" ]; then
            echo "::error::Не задан секрет DEPLOY_KNOWN_HOSTS. Создайте его в Settings -> Secrets and variables -> Actions."
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1
          echo "Оба секрета на месте."

      - name: Подготовить ключ и отпечаток сервера
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Отпечаток сервера берём из секрета, а не у того, кто ответит
          # на подключении. Подменить сервер по дороге нельзя.
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Ключ и отпечаток сервера записаны."

      - name: Выкат
        run: |
          # Строгая проверка ключа сервера. StrictHostKeyChecking=no
          # не используется нигде и никогда.
          # Команда на сервере не указывается: ключ привязан к единственной
          # разрешённой команде, что бы сюда ни передали.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Что делать, если выкат не прошёл
        if: failure()
        run: |
          echo "=============================================="
          echo " ВЫКАТ НЕ ПРОШЁЛ"
          echo "=============================================="
          echo "Что произошло: сайт НЕ обновился."
          echo "Главное: сайт продолжает работать на прошлой рабочей версии."
          echo "Скрипт выката проверяет новый код на отдельном порту ДО"
          echo "перезапуска, а если сайт всё же не поднялся - возвращает"
          echo "предыдущую версию сам."
          echo ""
          echo "Что делать:"
          echo "1. Посмотрите журнал шага «Выкат» выше - там русским языком"
          echo "   написано, на чём остановились."
          echo "2. Проверьте сайт: https://erekshe.kz/"
          echo "3. Если сайт работает - можно спокойно разбираться с правкой"
          echo "   и отправить исправление в main, выкат запустится заново."
          echo "4. Если сайт не открывается - зайдите на сервер (ssh erekshe)"
          echo "   и выполните: sudo systemctl restart erekshe"
          echo "=============================================="
          exit 1
