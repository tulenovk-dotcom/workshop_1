{% set mod = moderation_counts() %}
<nav class="admin-nav">
  <a href="/admin">Где заниматься</a>
  <a class="admin-nav-flag{% if not mod.total %} admin-nav-flag-clear{% endif %}"
     href="/admin#moderation">На модерации ({{ mod.total }})</a>
  <a href="/admin/applications">Заявки{% if mod.applications %} ({{ mod.applications }}){% endif %}</a>
  <a href="/admin/reviews">Отзывы{% if mod.reviews %} ({{ mod.reviews }}){% endif %}</a>
  <a href="/admin/methods">Справочник методов</a>
  <a href="/admin/logout">Выйти</a>
</nav>
