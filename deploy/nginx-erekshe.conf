# Конфиг nginx для erekshe.kz. Копируется в
# /etc/nginx/sites-available/erekshe.kz и включается ссылкой в
# sites-enabled. Строки про сертификат дописывает certbot сам - см.
# DEPLOY.md, порядок там такой: сначала этот файл без TLS, потом certbot.

# www отправляем на основной домен: один адрес вместо двух, чтобы
# поисковик не считал их разными сайтами.
server {
    listen 80;
    listen [::]:80;
    server_name www.erekshe.kz;

    # Проверка домена для сертификата идёт по http и должна доходить до
    # файла, а не улетать редиректом. Поэтому redirect стоит внутри
    # location /, а не на уровне server: директивы уровня server
    # выполняются раньше, чем выбирается location, и перехватили бы в том
    # числе запрос к /.well-known/acme-challenge/.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://erekshe.kz$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name erekshe.kz;

    # Проверка домена для сертификата: отдаём файл с диска, не трогая
    # приложение. Нужно и при выпуске, и при обновлении сертификата.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # До получения сертификата этот блок и отдаёт сайт. После certbot он
    # оставит здесь только проверку домена и редирект на https.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Адрес посетителя: приложение берёт его отсюда, потому что в
        # переменных окружения задано TRUST_PROXY_HEADERS=1. Заголовок
        # перезаписывается, а не дополняется, - присланному клиентом
        # значению верить нельзя.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Загруженные фото и стили отдаёт nginx: приложению эту работу
    # делать незачем. Пути совпадают с UPLOAD_DIR и папкой проекта.
    location /static/uploads/ {
        alias /srv/erekshe/data/uploads/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /srv/erekshe/app/static/;
        access_log off;
        expires 7d;
    }

    # Фото до 2 МБ принимает само приложение; запас на служебные поля.
    client_max_body_size 4m;

    # Небольшие заголовки безопасности. Content-Security-Policy здесь нет
    # намеренно: страницы тянут шрифты с Google Fonts, и строгая политика
    # сломала бы их раньше, чем шрифты переедут на свой сервер.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
}
